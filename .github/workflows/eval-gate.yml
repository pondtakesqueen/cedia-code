name: eval-gate

# The regression gate (evals/gate/README.md) runs where a key and a quota are: your machine or a Claude session.
# On a pull request CI only checks that it was run: a PR that changes what the model sees or how a run is scored
# needs a gate report, or a reason the gate is not needed, in its "Eval gate" section (evals/gate-report.ts). That
# check calls no model and needs no secret. The gate itself can still run here by hand (Actions, eval-gate, Run
# workflow) once an OPENCODE_API_KEY secret exists; it never updates a baseline.

on:
  pull_request:
    # edited: fixing the description reruns the check without a push.
    types: [opened, edited, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite file'
        default: 'evals/gate/suite.json'
      only:
        description: 'Comma-separated task ids (empty: the whole suite)'
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The base commit, for the list of changed files.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # No install: the check imports only node built-ins.
      - run: bun evals/gate-report.ts

  gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      SUITE: ${{ inputs.suite }}
      ONLY: ${{ inputs.only }}
    steps:
      - name: Check the key
        run: |
          if [ -z "$OPENCODE_API_KEY" ]; then
            echo "::error::Add an OPENCODE_API_KEY repository secret to run the gate here, or run bun evals/gate.ts locally."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          # The real-* tasks are built from this repository's history.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
          cache: true
      - name: Sandbox and verify tools
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Two tasks verify with pytest.
          python3 -m pip install --user -q pytest
      - run: bun install --frozen-lockfile
      - name: Estimate
        run: bun evals/gate.ts --suite "$SUITE" --estimate
      - name: Gate
        run: |
          args=(--suite "$SUITE")
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          set +e
          bun evals/gate.ts "${args[@]}" 2>&1 | tee gate.log
          code=${PIPESTATUS[0]}
          set -e
          # The report starts at the "Spent" line; the per-run lines above it are in the job log. A gate that stopped
          # before running (missing verify tools, estimate above maxUsd) has no such line: show its last lines.
          report=$(sed -n '/^Spent \$/,$p' gate.log)
          [ -n "$report" ] || report=$(tail -n 20 gate.log)
          {
            echo "### Eval gate: \`$SUITE\` (exit $code)"
            echo
            echo '```'
            echo "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-gate
          path: |
            evals/results/*.jsonl
            gate.log
          if-no-files-found: ignore
          retention-days: 30
