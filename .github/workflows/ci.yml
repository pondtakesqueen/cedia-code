name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The repo eval tasks are built from this repository's history.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
          cache: true
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The repo eval tasks are built from this repository's history.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
          cache: true
      - name: Sandbox dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          # Skip the man-db index rebuild that apt runs after installing; CI never reads man pages.
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends bubblewrap socat ripgrep ffmpeg
          # Ubuntu 24.04 strips capabilities from unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Since mid-November 2026 that is not enough on the runner image: bwrap makes its own user namespace, but
          # the seccomp helper's nested one inside it comes out without capabilities ("apply-seccomp: write
          # /proc/self/setgroups (nested userns is capability-restricted ...)"), so every sandboxed command fails.
          # A profile that restricts bwrap's children (Ubuntu's bwrap-userns-restrict) is taken off, and bwrap gets
          # one that grants user namespaces, which what it starts inherits.
          sysctl -a 2>/dev/null | grep apparmor_restrict || true
          sudo aa-status 2>/dev/null | grep -i bwrap || true
          if [ -e /etc/apparmor.d/bwrap-userns-restrict ]; then sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict || true; fi
          printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' 'profile cedia-ci-bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' '}' | sudo tee /etc/apparmor.d/cedia-ci-bwrap >/dev/null
          sudo apparmor_parser -r /etc/apparmor.d/cedia-ci-bwrap
          bwrap --unshare-user --bind / / -- unshare -Ur true && echo 'nested user namespace: ok' || echo 'nested user namespace: refused'
      - name: Sandbox dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - run: bun install --frozen-lockfile
      # One worker per core: the suite is mostly waiting on child processes, so files in parallel cut it from ~4
      # minutes to ~1. Bun 1.4.2's spawnSync could spin forever on a child that had exited (sandbox.test.ts and
      # threads.test.ts, in a third or more of runs), which 1.4.4 does not.
      - run: bun test --parallel
        env:
          CEDIA_REQUIRE_SANDBOX: '1'

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The repo eval tasks are built from this repository's history.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
          cache: true
      - run: bun install --frozen-lockfile
      - run: bun run build:release
      - run: ./dist/cedia --version --json
