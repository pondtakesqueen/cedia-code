name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The repo eval tasks are built from this repository's history.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
          cache: true
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The repo eval tasks are built from this repository's history.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
          cache: true
      - name: Sandbox dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap socat ripgrep ffmpeg
          # Ubuntu 24.04 strips capabilities from unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Sandbox dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - run: bun install --frozen-lockfile
      - run: bun test
        env:
          CEDIA_REQUIRE_SANDBOX: '1'

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The repo eval tasks are built from this repository's history.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
          cache: true
      - run: bun install --frozen-lockfile
      - run: bun run build:release
      - run: ./dist/cedia --version --json
